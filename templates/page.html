<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{title}} — {{site_title}}</title>
	<script src="/assets/dark_toggle.js"></script>
	<link rel="stylesheet" href="/assets/pico.min.css">
	<link rel="stylesheet" href="/assets/dark_toggle.css">
	<link rel="stylesheet" href="/assets/theme.css">
	<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
	<header class="container">
		<nav>
			<ul>
				<li><a href="/"><strong>{{site_title}}</strong></a></li>
			</ul>
			<ul>
				{% for link in navigation %}
				<li><a href="{{link.url}}">{{link.label}}</a></li>
				{% endfor %}
				<li id="theme-control" hidden>
					<button id="theme-switcher" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
						<span aria-hidden="true">☀️</span>
						<span aria-hidden="true">🌑</span>
					</button>
				</li>
			</ul>
		</nav>
	</header>
	<main class="container">
		{% if error %}
		<h1>{{title}}</h1>
		<p>{{message}}</p>
		{% else %}
{{content()}}
		{% endif %}
	</main>
</body>
</html>
