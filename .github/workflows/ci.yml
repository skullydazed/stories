name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
  analysis:
    name: Clang static analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cmake git ninja-build pkgconf python3
      - name: Build dependencies
        run: |
          export CC=clang CXX=clang++
          python3 tools/build-dependencies.py build-deps
      - name: Analyze application and C tests
        shell: bash
        run: |
          cmake -B build-analysis -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build-deps" -DSTORIES_WARNINGS_AS_ERRORS=ON -DCMAKE_C_CLANG_TIDY=clang-tidy
          cmake --build build-analysis --clean-first --parallel 2 2>&1 | tee build-analysis/analysis.log
      - name: Save analyzer log and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-analysis
          path: |
            build-analysis/analysis.log
            build-analysis/CMakeFiles/CMakeConfigureLog.yaml
            build-analysis/CMakeFiles/CMakeOutput.log
            build-analysis/CMakeFiles/CMakeError.log
          retention-days: 7
  sanitizers:
    name: Linux sanitizers and fuzzing
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkgconf python3
      - name: Test with ASan, UBSan, and libFuzzer
        run: |
          export CC=clang CXX=clang++
          python3 tools/build-dependencies.py build-deps
          export CMAKE_PREFIX_PATH="$PWD/build-deps"
          tools/ci.sh
      - name: Save test diagnostics and fuzz findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-logs
          path: |
            build-ci/CMakeFiles/CMakeConfigureLog.yaml
            build-ci/CMakeFiles/CMakeOutput.log
            build-ci/CMakeFiles/CMakeError.log
            build-ci/Testing/Temporary/
            build-ci-fuzz/CMakeFiles/CMakeConfigureLog.yaml
            build-ci-fuzz/CMakeFiles/CMakeOutput.log
            build-ci-fuzz/CMakeFiles/CMakeError.log
            build-ci-fuzz/Testing/Temporary/
            build-ci-fuzz/fuzz-artifacts/
          retention-days: 7
