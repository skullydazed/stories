name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    uses: ./.github/workflows/build.yml
  sanitizers:
    name: Linux sanitizers and fuzzing
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PKG_CONFIG: pkgconf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkgconf python3-pip
          python3 -m pip install --upgrade meson
      - name: Test with ASan, UBSan, and libFuzzer
        run: |
          export CC=clang CXX=clang++
          python3 tools/build-dependencies.py build-deps
          export PKG_CONFIG_LIBDIR="$PWD/build-deps/lib/pkgconfig:$PWD/build-deps/share/pkgconfig"
          export CFLAGS="-I$PWD/build-deps/include"
          export LDFLAGS="-L$PWD/build-deps/lib"
          tools/ci.sh
      - name: Save test diagnostics and fuzz findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-logs
          path: |
            build-ci/meson-logs/
            build-ci-fuzz/meson-logs/
            build-ci-fuzz/fuzz-artifacts/
          retention-days: 7
