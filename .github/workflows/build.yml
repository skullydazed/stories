name: Build and test

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  platforms:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: freebsd14-amd64
            runner: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PKG_CONFIG: pkgconf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set release version
        if: inputs.tag != ''
        run: printf '%s\n' "${RELEASE_TAG#v}" > VERSION
      - name: Install Linux tools
        if: runner.os == 'Linux' && matrix.target != 'freebsd14-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkgconf python3-pip
          python3 -m pip install --upgrade meson
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkgconf cmake
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Build, test, and package
        if: matrix.target != 'freebsd14-amd64'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export CC=clang CXX=clang++
          python3 tools/build-dependencies.py build-deps
          export PKG_CONFIG_LIBDIR="$PWD/build-deps/lib/pkgconfig:$PWD/build-deps/share/pkgconfig"
          export CFLAGS="-I$PWD/build-deps/include"
          export LDFLAGS="-L$PWD/build-deps/lib"
          meson setup build-release --buildtype=release --prefix=/ --libdir=lib -Dwerror=true
          meson compile -C build-release
          meson test -C build-release --print-errorlogs
          python3 tools/package-release.py build-release build-deps "$TARGET"
      - name: Build, test, and package on FreeBSD
        if: matrix.target == 'freebsd14-amd64'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '14.4'
          arch: x86_64
          envs: RELEASE_TAG PKG_CONFIG
          prepare: pkg install -y python3 meson ninja pkgconf cmake git
          run: |
            set -eu
            export CC=clang CXX=clang++
            python3 tools/build-dependencies.py build-deps
            export PKG_CONFIG_LIBDIR="$PWD/build-deps/lib/pkgconfig:$PWD/build-deps/share/pkgconfig"
            export CFLAGS="-I$PWD/build-deps/include"
            export LDFLAGS="-L$PWD/build-deps/lib"
            meson setup build-release --buildtype=release --prefix=/ --libdir=lib -Dwerror=true
            meson compile -C build-release
            meson test -C build-release --print-errorlogs
            python3 tools/package-release.py build-release build-deps freebsd14-amd64
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.target }}
          path: build-release/meson-logs/
          retention-days: 7
      - name: Upload release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 7
