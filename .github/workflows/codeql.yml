name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkgconf python3
      # Build dependencies before CodeQL starts tracing so only Stories is analyzed.
      - name: Build dependencies
        run: |
          export CC=clang CXX=clang++
          python3 tools/build-dependencies.py build-deps
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build application
        run: |
          export CC=clang CXX=clang++
          cmake -B build-codeql -G Ninja -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$PWD/build-deps"
          cmake --build build-codeql --parallel 2
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
