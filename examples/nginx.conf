# Include this in nginx's http context; create an nginx-owned cache root.
proxy_cache_path /var/cache/nginx/stories levels=1:2 keys_zone=stories:10m max_size=100m inactive=1h;

server {
    listen 80;
    server_name docs.example.org;
    # Match the original URI, including arguments, before redirecting or proxying.
    if ($request_uri ~ "%00") {
        return 400;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name docs.example.org;
    # Match the original URI, including arguments, before redirecting or proxying.
    if ($request_uri ~ "%00") {
        return 400;
    }
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache stories;
        proxy_cache_lock on;
        # The proxy controls freshness, including for CivetWeb static responses.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 301 60s;
        proxy_cache_valid 404 0s;
    }
}
