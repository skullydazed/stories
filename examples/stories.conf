# Paths are relative to this configuration file. Create the two roots before starting.
# In production place your edited file at ./stories.conf or /etc/stories.conf.
[server]
listen = 127.0.0.1:8080
threads = 8

[content]
root = ../docroot
resolution_order = disambiguation, command, function, on, ctcp, set, window, script, special
# Byte limits apply independently to source and complete HTML output.
markdown_limit = 8388608
output_limit = 33554432

[site]
title = EPIC6 Documentation

[navigation]
Home = /
Commands = /command/
Functions = /function/

[assets]
root = ../site-assets
